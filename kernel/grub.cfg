# Mirror GRUB's console to COM1 so the boot menu and any load errors are visible
# over a serial console (headless QEMU and the PXE/serial test mules).
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

set timeout=1
set default=0

menuentry "Cardinal" {
	multiboot2 /boot/kernel.bin
	module2 /boot/initrd
	#set gfxpayload=1920x1080,1366x768,1280x720,1024x768,800x600,640x480
	set gfxpayload=640x480
}
